baseURL = 'https://lffc.us/'
languageCode = 'en-us'
title = 'Little Free Failure of Capitalism'
homeSubtitle = "Pithy mutual aid. Doing more than nothing."
theme = 'hermit-v2'

# [outputs]
#   home = ['html', 'rss']
#   page = ['html']
#   rss = ['rss']
#   section = ['html', 'rss']
#   taxonomy = ['html', 'rss']
#   term = ['html', 'rss']

# enableGitInfo = true

pygmentsCodefences  = true
pygmentsUseClasses  = true
#hasCJKLanguage = true

rssLimit = 10

copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License."
enableEmoji = true

#[services]
#  [services.disqus]
#    shortname = ''
#  [services.googleAnalytics]
#    id = ''


[frontmatter]
date = ["lastmod", "date", "publishDate"]
lastmod = ["date", "lastmod", ":git", "publishDate"]
publishDate = ["publishDate", "date"]
expiryDate = ["expiryDate"]


[params.author]
  name = "LFFC"
  about = "about"

[blackfriday]
  # hrefTargetBlank = true
  # noreferrerLinks = true
  # nofollowLinks = true

[taxonomies]
  tag = "tags"
  # Categories are disabled by default.
  # category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]


[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04 -0700"

  # Metadata mostly used in document's head
  description = "Pithy mutual aid. Doing more than nothing."
  themeColor = "#494f5c"

  footerCopyright = ' <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'

  justifyContent = false

  relatedPosts = true
  code_copy_button = true

  homeSubtitlePrinter = true
  scrollToTop = true 
  global_mathjax = false
  readTime = true
  readTimeSeparator = "\u2026 \u23F2 Reading Time:"
  # legacyLayout = false
  shareSocial = true
  # googleTagManager = "GTM-XXXXXXXX"
  # tagSymbol = "#"
  # categorySymbol = "⊲"
  pinned = "Pinned Posts"
  # pinnedSVGname = "pin"
  descriptionInPosts = true
  # initialPublish = "Initally Posted on: "
  human = ["single","posts"]
  # denyRobots = "noindex, nofollow, noarchive"
  # allowRobots = "index, follow"
  # siteNoIndex = false
  # noIndexPages = ["404 Page not found"]

  # [[params.socialLinks]]
  #   name = "github"
  #   url = "https://github.com/1bl4z3r/hermit-V2/tree/staging"

# Needed to allow iframe embeds for Google Forms and DonorBox
[markup.goldmark.renderer]
  unsafe = true

[menu]

  [[menu.main]]
    name = "About"
    url = "about/"
    weight = 10
    
  [[menu.main]]
    name = "Suggestions"
    url = "suggestions/"
    weight = 20
  
  [[menu.main]]
    name = "Call for Art"
    url = "art/"
    weight = 30
  
  [[menu.main]]
    name = "Donate"
    url = "donate/"
    weight = 40
    
  [[menu.main]]
    name = "Updates"
    url = "posts/"
    weight = 100
